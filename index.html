<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17271f">
<title>EMBER INN — First Night</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,main{margin:0;width:100%;height:100%;overflow:hidden;background:#16261f;color:#fff7e8;font-family:Inter,system-ui,-apple-system,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0}
.top{position:absolute;z-index:8;top:max(9px,env(safe-area-inset-top));left:9px;right:9px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand,.wallet,.quest,.panel,.offline,.toast{background:rgba(22,31,29,.91);border:1px solid rgba(255,229,174,.16);box-shadow:0 12px 34px #0006;backdrop-filter:blur(12px)}
.brand{pointer-events:auto;display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:15px}
.brand .fire{font-size:20px;filter:drop-shadow(0 0 8px #ff9a3c)}
.brand b{display:block;font-size:10px;letter-spacing:.12em;color:#ffe0a0}
.brand small{display:block;font-size:7px;color:#a9b9b0}
.wallet{pointer-events:auto;padding:8px 11px;border-radius:15px;text-align:right}
.wallet b{font-size:14px;color:#ffe09a}.wallet small{display:block;font-size:7px;color:#a9b9b0}
.quest{position:absolute;z-index:8;left:50%;bottom:max(78px,calc(env(safe-area-inset-bottom) + 68px));transform:translateX(-50%);width:min(340px,calc(100% - 28px));padding:8px 11px;border-radius:14px;text-align:center;font-size:9px;color:#cbd8d0}
.quest b{color:#ffd489}.quest em{font-style:normal;color:#83dfaa;font-weight:900}
.panel{position:absolute;z-index:12;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));padding:14px;border-radius:21px}
.panel.hidden,.offline.hidden,.toast.hidden{display:none}
.panel .close{position:absolute;right:9px;top:9px;width:31px;height:31px;border-radius:50%;background:#ffffff12}
.panel h2{margin:0 38px 2px 0;font-size:18px}.panel .sub{font-size:9px;color:#9fb2aa}
.panel .effect{margin:11px 0 9px;padding:9px;border-radius:12px;background:#ffffff0d;font-size:10px;color:#d9e7df;line-height:1.35}
.panel .next{font-size:9px;color:#96cba9;margin-bottom:9px}
.panel .up{width:100%;padding:12px;border-radius:12px;background:linear-gradient(#ffd37c,#e99543);color:#3a250e;font-weight:900}
.panel .up:disabled{opacity:.42;filter:grayscale(1)}
.panel .embernote{padding:10px;border-radius:12px;background:#ff9e2c12;border:1px solid #ffb34b24;color:#ffd9a3;font-size:10px;line-height:1.45}
.offline{position:absolute;z-index:14;top:72px;left:10px;right:10px;padding:12px;border-radius:16px;display:flex;gap:9px;align-items:center}
.offline div{flex:1}.offline b{display:block;font-size:11px}.offline small{font-size:8px;color:#a8bab0}
.offline button{padding:9px 11px;border-radius:10px;background:#86d5a5;color:#183221;font-weight:900}
.toast{position:absolute;z-index:20;top:25%;left:50%;transform:translateX(-50%);padding:10px 14px;border-radius:14px;font-size:11px;font-weight:800;text-align:center;white-space:nowrap}
.tip{position:absolute;z-index:7;right:9px;top:max(70px,calc(env(safe-area-inset-top) + 62px));width:128px;padding:7px 8px;border-radius:12px;background:#17221ddd;border:1px solid #ffffff10;font-size:8px;color:#aabbb2;text-align:right;pointer-events:none}
.tip b{display:block;color:#f3d69c;font-size:9px}
@media(min-width:760px){
 .panel{left:auto;right:18px;width:360px;bottom:18px}
 .quest{bottom:18px}
 .tip{right:18px}
}
</style>
</head>
<body>
<main>
<canvas id="game"></canvas>
<header class="top">
  <div class="brand"><span class="fire">🔥</span><div><b>EMBER INN</b><small>First Night · Rebuild 0.1</small></div></div>
  <div class="wallet"><b>🪙 <span id="coins">120</span></b><small><span id="served">0</span> hóspedes felizes</small></div>
</header>
<div class="tip"><b>TOQUE NO DIORAMA</b>Recepção, quartos, café e Ember podem evoluir.</div>
<div id="quest" class="quest"><b>✨ PRIMEIRA NOITE</b> Veja seu primeiro hóspede fazer check-in.</div>
<section id="panel" class="panel hidden">
  <button id="close" class="close">×</button>
  <h2 id="pname">Recepção</h2>
  <div id="psub" class="sub">Nível 1</div>
  <div id="peffect" class="effect"></div>
  <div id="pnext" class="next"></div>
  <button id="upgrade" class="up">Melhorar · <span id="pcost"></span></button>
</section>
<div id="offline" class="offline hidden"><span style="font-size:22px">🌙</span><div><b>A pousada continuou recebendo hóspedes.</b><small id="offtxt"></small></div><button id="collect">Coletar</button></div>
<div id="toast" class="toast hidden"></div>
</main>
<script>
(()=>{
const c=document.querySelector('#game'),x=c.getContext('2d'),$=s=>document.querySelector(s);
const U={coins:$('#coins'),served:$('#served'),quest:$('#quest'),panel:$('#panel'),close:$('#close'),pname:$('#pname'),psub:$('#psub'),peffect:$('#peffect'),pnext:$('#pnext'),upgrade:$('#upgrade'),pcost:$('#pcost'),offline:$('#offline'),offtxt:$('#offtxt'),collect:$('#collect'),toast:$('#toast')};
const V={w:540,h:860},K='ember-inn-first-night-01';
const imgs={};
[['citizens','assets/v04/citizens.webp'],['embers','assets/v04/embers.webp'],['nature','assets/v04/nature.webp']].forEach(([k,u])=>{let im=new Image();im.decoding='async';im.src=u+'?inn=01';imgs[k]=im});
function strip(im,idx,cell,dx,dy,dw,dh){if(im&&im.complete&&im.naturalWidth){x.drawImage(im,idx*cell,0,cell,cell,dx,dy,dw,dh);return true}return false}
function fresh(){return{coins:120,served:0,ember:1,flameXp:0,lvl:{reception:1,room1:1,cafe:1,room2:0,garden:0},unlocked:{room2:false,garden:false},quest:0,last:Date.now()}}
function load(){try{let f=fresh(),p=JSON.parse(localStorage.getItem(K)||'{}');let s=Object.assign(f,p);s.lvl=Object.assign(f.lvl,p.lvl||{});s.unlocked=Object.assign(f.unlocked,p.unlocked||{});return s}catch(e){return fresh()}}
let s=load(),view={scale:1,ox:0,oy:0,dpr:1},sel=null,last=performance.now(),spawnTimer=1.2,guests=[],gid=1,particles=[],coinsFx=[],embersFx=[],tipTimer=0;
const rooms={room1:{id:'room1',name:'Quarto A',x:95,y:285,w:130,h:105,clean:true,occupied:null},room2:{id:'room2',name:'Quarto B',x:250,y:300,w:130,h:105,clean:true,occupied:null}};
const cleaner={role:'cleaner',x:325,y:410,tx:325,ty:410,state:'idle',timer:0,target:null,sp:42,ph:0};
const iso={cx:270,cy:170,sx:.53,sy:.285};
function I(a,b,z=0){return{x:iso.cx+(a-b)*iso.sx,y:iso.cy+(a+b)*iso.sy-z}}
function inv(px,py){let dx=(px-iso.cx)/iso.sx,dy=(py-iso.cy)/iso.sy;return{x:(dx+dy)/2,y:(dy-dx)/2}}
function polyRect(a,b,w,h,z=0){return[I(a,b,z),I(a+w,b,z),I(a+w,b+h,z),I(a,b+h,z)]}
function pathPoly(p,col,stroke){x.beginPath();x.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)x.lineTo(p[i].x,p[i].y);x.closePath();if(col){x.fillStyle=col;x.fill()}if(stroke){x.strokeStyle=stroke;x.stroke()}}
function rr(a,b,w,h,r,col){x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=col;x.fill()}
function fmt(v){return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':Math.floor(v)}
function save(){s.last=Date.now();localStorage.setItem(K,JSON.stringify(s))}
function toast(t){U.toast.textContent=t;U.toast.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>U.toast.classList.add('hidden'),1650)}
function resize(){view.dpr=Math.min(devicePixelRatio||1,2);c.width=innerWidth*view.dpr;c.height=innerHeight*view.dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';view.scale=Math.min(innerWidth/V.w,innerHeight/V.h);view.ox=(innerWidth-V.w*view.scale)/2;view.oy=(innerHeight-V.h*view.scale)/2}
addEventListener('resize',resize);resize();
function cost(id){let l=s.lvl[id]||1,base={reception:70,room1:85,room2:95,cafe:90,garden:125}[id]||100;return Math.floor(base*Math.pow(1.72,l-1))}
function maxGuests(){return s.unlocked.room2?5:3}
function checkinTime(){return Math.max(.8,3.2-s.lvl.reception*.48)}
function roomTime(id){return Math.max(3.5,9-(s.lvl[id]||1)*.85)}
function cafeTime(){return Math.max(1.6,5.5-s.lvl.cafe*.65)}
function roomPay(id){return 18+(s.lvl[id]||1)*8}
function cafePay(){return 6+s.lvl.cafe*5}
function gardenPay(){return s.unlocked.garden?10+s.lvl.garden*5:0}
function nextThreshold(){return s.ember===1?5:s.ember===2?14:s.ember===3?30:50+(s.ember-4)*25}
function stationName(id){return{reception:'Recepção',room1:'Quarto A',room2:'Quarto B',cafe:'Café da Ember',garden:'Jardim Termal',ember:'Ember'}[id]}
function stationEffect(id){let l=s.lvl[id]||1;if(id==='reception')return 'Check-in em '+checkinTime().toFixed(1)+'s. Nv.'+l+' deixa a fila andar mais rápido e melhora o balcão.';if(id==='room1'||id==='room2')return 'Cada estadia rende cerca de 🪙 '+roomPay(id)+' e dura '+roomTime(id).toFixed(1)+'s.';if(id==='cafe')return 'Serve hóspedes em '+cafeTime().toFixed(1)+'s e adiciona 🪙 '+cafePay()+' por pedido.';if(id==='garden')return 'Cada visita ao jardim adiciona 🪙 '+gardenPay()+' e deixa o resort mais valioso.';return ''}
function stationNext(id){let l=(s.lvl[id]||1)+1;if(id==='reception')return 'Próximo: balcão mais completo + check-in mais rápido.';if(id==='room1'||id==='room2')return 'Próximo: decoração nova + estadia mais curta + diária maior.';if(id==='cafe')return 'Próximo: mais mesas, mais vapor e serviço mais rápido.';if(id==='garden')return 'Próximo: mais plantas, luzes e bônus por hóspede.';return ''}
function unlockCheck(){
 let changed=false;
 if(!s.unlocked.room2&&s.served>=5){s.unlocked.room2=true;s.lvl.room2=1;s.ember=Math.max(2,s.ember);changed=true;burst(I(315,350).x,I(315,350).y,55);toast('🔥 A Ember abriu o Quarto B!')}
 if(!s.unlocked.garden&&s.served>=14){s.unlocked.garden=true;s.lvl.garden=1;s.ember=Math.max(3,s.ember);changed=true;burst(I(380,140).x,I(380,140).y,70);toast('🌿 Jardim Termal desbloqueado!')}
 if(s.served>=30&&s.ember<4){s.ember=4;changed=true;burst(I(235,205).x,I(235,205).y,90);toast('🔥 A Ember ficou radiante!')}
 if(changed)save()
}
function burst(px,py,n=28){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*90,vy:-25-Math.random()*90,l:1,r:1.5+Math.random()*2.8})}
function coinBurst(px,py,value){for(let i=0;i<Math.min(9,3+Math.floor(value/20));i++)coinsFx.push({x:px+(Math.random()-.5)*15,y:py+(Math.random()-.5)*8,vy:-20-Math.random()*25,l:1})}
function emberTrail(px,py){embersFx.push({x:px,y:py,t:0,l:1})}
function availableRoom(){let list=[rooms.room1];if(s.unlocked.room2)list.push(rooms.room2);return list.find(r=>r.clean&&!r.occupied)}
function spawnGuest(){
 if(guests.length>=maxGuests())return;
 guests.push({id:gid++,role:['resident','farmer','delivery'][gid%3],x:5,y:215,tx:55,ty:215,state:'arrive',timer:0,room:null,earned:0,ph:Math.random()*6,sp:37+Math.random()*6,step:0})
}
function receptionQueue(){return guests.filter(g=>g.state==='arrive'||g.state==='queue'||g.state==='checkin'||g.state==='waitingRoom').sort((a,b)=>a.id-b.id)}
function cafeQueue(){return guests.filter(g=>g.state==='toCafe'||g.state==='cafe').sort((a,b)=>a.id-b.id)}
function setTarget(g,a,b){g.tx=a;g.ty=b}
function dist(g){return Math.hypot(g.tx-g.x,g.ty-g.y)}
function move(g,dt){let dx=g.tx-g.x,dy=g.ty-g.y,d=Math.hypot(dx,dy);if(d>2){g.x+=dx/d*g.sp*dt;g.y+=dy/d*g.sp*dt;return false}return true}
function updateGuest(g,dt){
 g.ph+=dt*6;
 if(g.state==='arrive'||g.state==='queue'||g.state==='waitingRoom'){
   let q=receptionQueue(),idx=q.indexOf(g),first=idx===0;
   setTarget(g,75-Math.min(idx,3)*18,205+Math.min(idx,3)*8);
   if(move(g,dt)&&first){
     let r=availableRoom();
     if(r){g.state='checkin';g.timer=checkinTime();setTarget(g,92,205)}
     else g.state='waitingRoom';
   }
 }else if(g.state==='checkin'){
   g.timer-=dt;
   if(g.timer<=0){
     let r=availableRoom();
     if(!r){g.state='waitingRoom';return}
     r.occupied=g.id;g.room=r.id;g.state='toRoom';setTarget(g,r.x+r.w*.5,r.y+r.h*.62);
   }
 }else if(g.state==='toRoom'){
   if(move(g,dt)){g.state='stay';g.timer=roomTime(g.room)}
 }else if(g.state==='stay'){
   g.timer-=dt;
   if(g.timer<=0){
     let r=rooms[g.room];r.occupied=null;r.clean=false;g.earned+=roomPay(g.room);
     g.state='toCafe';setTarget(g,335,95);
   }
 }else if(g.state==='toCafe'){
   let q=cafeQueue(),idx=q.indexOf(g);setTarget(g,335+Math.min(idx,2)*20,105+Math.min(idx,2)*16);
   if(move(g,dt)&&idx===0){g.state='cafe';g.timer=cafeTime()}
 }else if(g.state==='cafe'){
   g.timer-=dt;
   if(g.timer<=0){
     g.earned+=cafePay();
     if(s.unlocked.garden){g.state='toGarden';setTarget(g,385,165)}
     else{g.state='checkout';setTarget(g,115,205)}
   }
 }else if(g.state==='toGarden'){
   if(move(g,dt)){g.state='garden';g.timer=Math.max(1.8,4.5-s.lvl.garden*.45)}
 }else if(g.state==='garden'){
   g.timer-=dt;
   if(g.timer<=0){g.earned+=gardenPay();g.state='checkout';setTarget(g,115,205)}
 }else if(g.state==='checkout'){
   if(move(g,dt)){g.state='pay';g.timer=1.1}
 }else if(g.state==='pay'){
   g.timer-=dt;
   if(g.timer<=0){
     let bonus=8+s.lvl.reception*3,total=g.earned+bonus;s.coins+=total;s.served++;s.flameXp++;let p=I(115,205,20);coinBurst(p.x,p.y,total);emberTrail(p.x,p.y);g.state='leave';setTarget(g,0,215);unlockCheck();questCheck();save()
   }
 }else if(g.state==='leave'){
   if(move(g,dt))g.dead=true
 }
}
function updateCleaner(dt){
 cleaner.ph+=dt*5;
 if(cleaner.state==='idle'){
   let dirty=[rooms.room1].concat(s.unlocked.room2?[rooms.room2]:[]).find(r=>!r.clean&&!r.occupied);
   if(dirty){cleaner.target=dirty.id;cleaner.state='toRoom';cleaner.tx=dirty.x+dirty.w*.35;cleaner.ty=dirty.y+dirty.h*.72}
 }else if(cleaner.state==='toRoom'){
   if(move(cleaner,dt)){cleaner.state='clean';cleaner.timer=Math.max(1.2,4.2-(s.lvl.reception-1)*.35)}
 }else if(cleaner.state==='clean'){
   cleaner.timer-=dt;
   if(cleaner.timer<=0){rooms[cleaner.target].clean=true;let p=I(cleaner.x,cleaner.y,18);burst(p.x,p.y,14);cleaner.target=null;cleaner.state='return';cleaner.tx=325;cleaner.ty=410}
 }else if(cleaner.state==='return'){
   if(move(cleaner,dt))cleaner.state='idle'
 }
}
function questCheck(){
 if(s.quest===0&&s.served>=1){s.quest=1;toast('Primeiro hóspede feliz ✨')}
 if(s.quest===1&&s.lvl.reception>=2){s.quest=2;toast('Recepção melhorada!')}
 if(s.quest===2&&s.served>=5){s.quest=3}
 if(s.quest===3&&s.lvl.cafe>=2){s.quest=4}
 if(s.quest===4&&s.served>=14){s.quest=5}
}
function questText(){
 if(s.quest===0)return '<b>✨ PRIMEIRA NOITE</b> Veja seu primeiro hóspede completar a estadia.';
 if(s.quest===1)return '<b>🛎️ PRIMEIRO UPGRADE</b> Toque na Recepção e melhore o balcão.';
 if(s.quest===2)return '<b>🔥 ALIMENTE A EMBER</b> Atenda <em>'+s.served+'/5</em> hóspedes para abrir outro quarto.';
 if(s.quest===3)return '<b>☕ MAIS SERVIÇO</b> Melhore o Café da Ember para aumentar cada conta.';
 if(s.quest===4)return '<b>🌿 PRÓXIMA ÁREA</b> Atenda <em>'+s.served+'/14</em> hóspedes para abrir o jardim.';
 return '<b>🔥 EMBER RESORT</b> Continue evoluindo setores e veja a pousada crescer.';
}
function openPanel(id){
 sel=id;U.panel.classList.remove('hidden');U.pname.textContent=stationName(id);
 if(id==='ember'){
   U.psub.textContent='Coração da pousada · Nível '+s.ember;
   let need=Math.max(0,nextThreshold()-s.served);
   U.peffect.innerHTML='<div class="embernote">A Ember cresce com <b>hóspedes felizes</b>. Ela não usa barra de energia: a própria chama muda, alcança novas áreas e libera setores.</div>';
   U.pnext.textContent=need?('Faltam '+need+' hóspedes felizes para o próximo marco.'):'A Ember está pronta para mudar.';
   U.upgrade.style.display='none';return;
 }
 if((id==='room2'&&!s.unlocked.room2)||(id==='garden'&&!s.unlocked.garden)){
   U.psub.textContent='Área ainda escura';U.peffect.textContent=id==='room2'?'A Ember precisa sentir 5 hóspedes felizes para iluminar este quarto.':'A Ember precisa sentir 14 hóspedes felizes para alcançar o jardim.';U.pnext.textContent='Continue atendendo hóspedes.';U.upgrade.style.display='none';return
 }
 U.upgrade.style.display='block';U.psub.textContent='Nível '+s.lvl[id];U.peffect.textContent=stationEffect(id);U.pnext.textContent=stationNext(id);let k=cost(id);U.pcost.textContent='🪙 '+fmt(k);U.upgrade.disabled=s.coins<k
}
U.close.onclick=()=>{sel=null;U.panel.classList.add('hidden')};
U.upgrade.onclick=()=>{if(!sel||sel==='ember')return;let k=cost(sel);if(s.coins<k)return toast('Faltam moedas.');s.coins-=k;s.lvl[sel]++;let p=stationCenter(sel);burst(p.x,p.y,36);toast(stationName(sel)+' evoluiu!');questCheck();openPanel(sel);save()};
function stationCenter(id){
 let a={reception:[105,205],room1:[160,340],room2:[315,352],cafe:[355,115],garden:[390,165],ember:[235,205]}[id];return I(a[0],a[1],24)
}
function stationAt(vx,vy){
 let q=inv(vx,vy),p=q.x,y=q.y;
 if(p>55&&p<155&&y>170&&y<240)return'reception';
 if(p>rooms.room1.x&&p<rooms.room1.x+rooms.room1.w&&y>rooms.room1.y&&y<rooms.room1.y+rooms.room1.h)return'room1';
 if(p>rooms.room2.x&&p<rooms.room2.x+rooms.room2.w&&y>rooms.room2.y&&y<rooms.room2.y+rooms.room2.h)return'room2';
 if(p>285&&p<420&&y>55&&y<165)return'cafe';
 if(p>345&&p<440&&y>135&&y<245)return'garden';
 if(Math.hypot(p-235,y-205)<62)return'ember';
 return null
}
c.addEventListener('pointerup',e=>{let vx=(e.clientX-view.ox)/view.scale,vy=(e.clientY-view.oy)/view.scale,id=stationAt(vx,vy);if(id)openPanel(id)});
function nat(idx,a,b,size=58){let p=I(a,b);return strip(imgs.nature,idx,64,p.x-size/2,p.y-size*.78,size,size)}
function drawBg(){
 let g=x.createLinearGradient(0,0,0,V.h);g.addColorStop(0,'#6da8b5');g.addColorStop(.46,'#9cc9a9');g.addColorStop(1,'#315e4c');x.fillStyle=g;x.fillRect(0,0,V.w,V.h);
 x.fillStyle='#2c6d70';x.beginPath();x.ellipse(270,700,420,170,0,0,7);x.fill();
 x.fillStyle='#7fbf8d';x.beginPath();x.ellipse(270,490,355,270,0,0,7);x.fill();
 [[10,80,0,74],[65,50,2,68],[445,72,1,76],[485,120,0,70],[32,470,1,76],[475,465,2,72],[80,550,3,60],[430,550,0,74]].forEach(a=>nat(a[2],a[0],a[1],a[3]))
}
function floor(){
 let p=polyRect(35,35,425,420);x.shadowColor='#0007';x.shadowBlur=25;pathPoly(p,'#a76f43');x.shadowBlur=0;
 // rugs / zones
 pathPoly(polyRect(55,165,115,85),'#7d4d37','#d8a471');
 pathPoly(polyRect(280,50,150,125),'#c99158','#f0c987');
 pathPoly(polyRect(80,270,155,135),'#9a765c','#d9ad85');
 pathPoly(polyRect(240,285,150,135),s.unlocked.room2?'#8c735e':'#3c5147',s.unlocked.room2?'#d9ad85':'#658175');
 pathPoly(polyRect(335,125,115,130),s.unlocked.garden?'#6f9a62':'#355247',s.unlocked.garden?'#b7d49a':'#55766b');
 // front deck / entrance
 pathPoly(polyRect(0,185,80,60),'#8d623f','#cda477')
}
function wallLine(a,b,c,d,h=28,col='#6c4936'){
 let p1=I(a,b),p2=I(c,d),q2=I(c,d,h),q1=I(a,b,h);pathPoly([p1,p2,q2,q1],col,'#412f27')
}
function walls(){
 wallLine(35,35,460,35,35,'#6d4d38');wallLine(35,35,35,455,35,'#76523c');
 wallLine(80,270,235,270,22,'#78533e');wallLine(80,270,80,405,22,'#795540');
 if(s.unlocked.room2){wallLine(240,285,390,285,22,'#73503d')}
}
function reception(){
 let l=s.lvl.reception,p=I(105,205,8);pathPoly(polyRect(72,185,70+Math.min(3,l)*8,34,8),'#775039','#d6a36b');
 x.font='18px system-ui';x.textAlign='center';x.fillText('🛎️',p.x,p.y-9);
 if(l>=2){x.fillStyle='#f3bd6f';x.beginPath();x.arc(p.x+31,p.y-5,5,0,7);x.fill()}
 if(l>=3){x.fillStyle='#7ab07a';x.beginPath();x.arc(p.x-32,p.y-7,7,0,7);x.fill()}
 x.textAlign='left'
}
function bed(id){
 let r=rooms[id],l=s.lvl[id]||1,p=polyRect(r.x+22,r.y+22,r.w-44,r.h-48,5);pathPoly(p,l>=3?'#d9a6a0':'#c88f78','#f2c6a9');
 let h=I(r.x+r.w*.42,r.y+30,11);x.fillStyle='#f9ead4';x.beginPath();x.ellipse(h.x,h.y,24,10,-.22,0,7);x.fill();
 if(l>=2){let a=I(r.x+18,r.y+r.h-18,8);x.fillStyle='#f2c468';x.beginPath();x.arc(a.x,a.y,6,0,7);x.fill()}
 if(l>=3){let a=I(r.x+r.w-18,r.y+18,5);x.fillStyle='#6ca56c';x.beginPath();x.arc(a.x,a.y,8,0,7);x.fill()}
 if(!r.clean){let d=I(r.x+r.w*.62,r.y+r.h*.55,22);x.font='14px system-ui';x.fillText('🧹',d.x,d.y)}
 if(r.occupied){let z=I(r.x+r.w*.55,r.y+r.h*.46,34);x.fillStyle='#fff5d6';x.font='700 12px system-ui';x.fillText('zZ',z.x,z.y)}
}
function cafe(){
 let l=s.lvl.cafe;pathPoly(polyRect(300,65,105,32,8),'#7c5538','#d6a46d');pathPoly(polyRect(315,115,42,42,3),'#b87f4d','#e2b47a');
 let p=I(345,78,18);x.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<1+Math.min(3,l);i++){x.beginPath();x.arc(p.x+i*5,p.y-10-(performance.now()/450+i*4)%14,4+i,0,7);x.fill()}
 if(l>=2)pathPoly(polyRect(370,115,35,35,3),'#b87f4d','#e2b47a');
 if(l>=3){let sgn=I(345,52,34);rr(sgn.x-28,sgn.y-10,56,18,7,'#6a4332');x.fillStyle='#ffe0a5';x.font='700 8px system-ui';x.textAlign='center';x.fillText('CAFÉ',sgn.x,sgn.y+2);x.textAlign='left'}
}
function garden(){
 if(!s.unlocked.garden){let p=I(390,185,20);x.globalAlpha=.75;x.font='22px system-ui';x.textAlign='center';x.fillText('🔒',p.x,p.y);x.globalAlpha=1;x.textAlign='left';return}
 [[370,150,0,50],[420,155,1,48],[390,220,3,44]].forEach(a=>nat(a[2],a[0],a[1],a[3]));
 pathPoly(polyRect(375,175,50,24,5),'#8e603d','#c8a06d');
 let p=I(397,190,18);x.fillStyle='#82c6ca';x.beginPath();x.ellipse(p.x,p.y,24,8,0,0,7);x.fill();
 if(s.lvl.garden>=2){x.fillStyle='#ffd77a';for(let i=0;i<3;i++){let q=I(360+i*28,235,18);x.beginPath();x.arc(q.x,q.y,3,0,7);x.fill()}}
}
function ember(){
 let idx=Math.min(4,s.ember-1),p=I(235,205),size=80+idx*10,t=performance.now()/500;
 x.save();x.globalCompositeOperation='lighter';let g=x.createRadialGradient(p.x,p.y-20,4,p.x,p.y-20,68+idx*10);g.addColorStop(0,'#fff3ad7a');g.addColorStop(.5,'#ff9a3a38');g.addColorStop(1,'#ff6a1400');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y-20,70+idx*10,0,7);x.fill();x.restore();
 x.save();x.shadowColor='#ff8b35';x.shadowBlur=20+idx*5;if(!strip(imgs.embers,idx,72,p.x-size/2,p.y-size*.76,size,size)){x.fillStyle='#ff8a38';x.beginPath();x.arc(p.x,p.y-20,22+idx*5,0,7);x.fill()}x.restore();
 x.strokeStyle='rgba(255,216,116,'+(.25+.12*Math.sin(t))+')';x.lineWidth=2;x.beginPath();x.ellipse(p.x,p.y,48+idx*7,13+idx*2,0,0,7);x.stroke()
}
function drawCharacter(v,kind){
 let p=I(v.x,v.y,18),idx={receptionist:2,cook:1,cleaner:0,resident:5,farmer:3,delivery:4}[kind||v.role]??5,bob=Math.sin((v.ph||0))*1.3,size=46;
 x.save();x.translate(p.x,p.y+bob);let flip=(v.tx||v.x)<v.x;if(flip)x.scale(-1,1);if(!strip(imgs.citizens,idx,52,-size/2,-size*.74,size,size)){x.fillStyle='#e4a36f';x.beginPath();x.arc(0,-8,12,0,7);x.fill()}x.restore()
}
function staff(){
 drawCharacter({x:120,y:185,tx:120,ph:performance.now()/450},'receptionist');
 if(s.lvl.reception>=3)drawCharacter({x:145,y:205,tx:145,ph:performance.now()/520},'resident');
 drawCharacter({x:305,y:94,tx:305,ph:performance.now()/480},'cook');
 if(s.lvl.cafe>=3)drawCharacter({x:375,y:95,tx:375,ph:performance.now()/530},'merchant');
 drawCharacter(cleaner,'cleaner')
}
function locks(){
 if(!s.unlocked.room2){let p=I(315,350,35);x.fillStyle='#e2c58f';x.font='700 10px system-ui';x.textAlign='center';x.fillText('🔥 5 hóspedes',p.x,p.y);x.textAlign='left'}
 if(!s.unlocked.garden){let p=I(392,185,42);x.fillStyle='#e2c58f';x.font='700 9px system-ui';x.textAlign='center';x.fillText('🔥 14 hóspedes',p.x,p.y);x.textAlign='left'}
}
function fx(){
 particles.forEach(p=>{x.globalAlpha=p.l;x.fillStyle='#ffd47c';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.globalAlpha=1});
 coinsFx.forEach(p=>{x.globalAlpha=p.l;x.font='12px system-ui';x.fillText('🪙',p.x,p.y);x.globalAlpha=1});
 embersFx.forEach(p=>{let e=I(235,205,28),q=p.t,pX=p.x+(e.x-p.x)*q,pY=p.y+(e.y-p.y)*q-40*Math.sin(q*Math.PI);x.globalAlpha=p.l;x.fillStyle='#ffb34f';x.beginPath();x.arc(pX,pY,3,0,7);x.fill();x.globalAlpha=1})
}
function draw(){
 x.setTransform(view.dpr,0,0,view.dpr,0,0);x.clearRect(0,0,innerWidth,innerHeight);
 x.setTransform(view.dpr*view.scale,0,0,view.dpr*view.scale,view.dpr*view.ox,view.dpr*view.oy);
 drawBg();floor();walls();reception();bed('room1');if(s.unlocked.room2)bed('room2');cafe();garden();ember();staff();
 guests.slice().sort((a,b)=>a.y-b.y).forEach(g=>drawCharacter(g,g.role));locks();fx()
}
function update(dt){
 spawnTimer-=dt;if(spawnTimer<=0){spawnGuest();spawnTimer=Math.max(2.8,7.5-s.lvl.reception*.45)}
 guests.forEach(g=>updateGuest(g,dt));guests=guests.filter(g=>!g.dead);updateCleaner(dt);
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=55*dt;p.l-=dt*.9});particles=particles.filter(p=>p.l>0);
 coinsFx.forEach(p=>{p.y+=p.vy*dt;p.l-=dt*.75});coinsFx=coinsFx.filter(p=>p.l>0);
 embersFx.forEach(p=>{p.t+=dt*1.25;p.l=1-p.t});embersFx=embersFx.filter(p=>p.t<1);
 U.coins.textContent=fmt(s.coins);U.served.textContent=fmt(s.served);U.quest.innerHTML=questText();if(sel&&sel!=='ember')U.upgrade.disabled=s.coins<cost(sel)
}
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
function offline(){
 let sec=Math.min(28800,Math.max(0,(Date.now()-s.last)/1000));if(sec<45)return;
 let roomsN=s.unlocked.room2?2:1,cycle=Math.max(checkinTime()+2,(roomTime('room1')+cafeTime())/roomsN),n=Math.min(80,Math.floor(sec/cycle*.22)),avg=roomPay('room1')+cafePay()+8+s.lvl.reception*3+(s.unlocked.garden?gardenPay():0);if(n<1)return;
 s.pending={guests:n,coins:n*avg};U.offtxt.textContent=n+' hóspedes deixaram cerca de 🪙 '+fmt(s.pending.coins)+'.';U.offline.classList.remove('hidden')
}
U.collect.onclick=()=>{if(!s.pending)return;s.coins+=s.pending.coins;s.served+=s.pending.guests;s.flameXp+=s.pending.guests;s.pending=null;U.offline.classList.add('hidden');unlockCheck();questCheck();save();toast('A pousada acordou mais rica ✨')};
offline();unlockCheck();questCheck();save();
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('beforeunload',save);setInterval(save,5000);requestAnimationFrame(loop)
})();
</script>
</body>
